<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style2.css">
    <script type="module" src="/js/pages/course.js" defer></script>
    <title>Margin</title>
</head>
<body>
    <aside id="sidebar">
        <div class="logo">Margin</div>

        <nav class="sidebar-nav">
            <ul id="dashboard-item">
                <li><a href="/html/course.html">Dashboard</a></li>
            </ul>
            <p class="sidebar-label">My courses</p>
            <ul id="course-list">

            </ul>
        </nav>

        <button class="join-course-btn"><span class="plus-sign">+</span>Add Course</button>

        <div class="sidebar-user">
            <div class="user-icon">
                <img src="https://w0.peakpx.com/wallpaper/935/887/HD-wallpaper-deku-portrait-hero-green-mha.jpg" alt="headshot of izuku midoriya">
            </div>
            <div id="user-info">
            </div>
        </div>
    </aside>
    <main>
        <header class="course-header">
            <p class="current-site-location">Dashboard</p>
            <div class="user-div">
                <button class="dark-light-mode-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
                </button>
                <p class="vertical-bar">|</p>
                <div class="user-menu-container">
                    <button id="user-icon-btn">
                        <div class="user-initials-avatar">
                            <span class="initials">RS</span>
                        </div>
                        <span class="name">Raheem S.</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down-icon lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                </div>
                <!-- Dropdown Modal Content-->
                <div id="dropdown-modal" class="dropdown-content">
                    <a href="#profile">Profile</a>
                    <a href="#settings">Account Settings</a>
                    <a href="#logout">Log Out</a>
                </div>
            </div>
        </header>
        <div id="dashboard-container"></div>
        <!-- <div class="new-note-container"> 
            <h3>Create a new note</h3>
            <div class="title-container">

            </div>
            <div class="textarea-container">
                <textarea name="" id="note-content-input" cols="30" rows="10" 
                placeholder="Start writing your note here..."></textarea>
                <button id="create-note-btn">Create Note</button>
            </div>
        </div>
        <h3 class="notes-container-heading">Notes</h3>
        <div id="notes-container" class="notes-container">
        </div> -->
    </main>
</body>
</html>
